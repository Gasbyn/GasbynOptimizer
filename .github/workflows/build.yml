name: Build installer

on:
  push:
    branches: [ main, rewrite/v3-clean ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

# Buildy běží jeden po druhém, aby se číslo vydání nepřidělilo dvakrát.
concurrency:
  group: gasbyn-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Jednorázový úklid: omylem vydané v2.0.2 (sestavené z commitu f7423bb) se smaže, aby první stabilní vydání bylo v2.0.0.
      # Podmínka na commit zajistí, že se nikdy nesmaže pozdější legitimní vydání v2.0.2.
      - name: Smazat omylem vydané v2.0.2
        shell: pwsh
        continue-on-error: true
        run: |
          $sha = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v2.0.2" --jq '.target_commitish' 2>$null
          if ($sha -eq 'f7423bb965b9ae1c5d91c9361f2e92b0497a1aab') {
            gh release delete v2.0.2 --cleanup-tag --yes
            Write-Host 'Vydání v2.0.2 smazáno.'
          }

      # Každý push do main (nebo větve rewrite/v3-clean) vydá nový release v2.0.N s instalátorem (už to není beta).
      # Číslo N je nejvyšší dosavadní + 1 (první je v2.0.0). Číselná verze 2.0.N.0 používá .NET i instalátor a podle ní se aplikace sama aktualizuje.
      # Betaverze (2.0.1.N) aplikace při hledání aktualizací ignoruje.
      - name: Určit verzi
        id: ver
        shell: pwsh
        run: |
          $release = 'false'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            $label = $tag.TrimStart('v', 'V')
            $parts = [regex]::Matches($label, '\d+') | ForEach-Object { $_.Value }
            $version = ($parts | Select-Object -First 4) -join '.'
            $release = 'true'
          } elseif ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $version = [regex]::Match((Get-Content GasbynOptimizer.csproj -Raw), '<Version>([^<]+)</Version>').Groups[1].Value
            $label = $version
            $tag = ''
          } else {
            $tags = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name')
            # Stabilní vydání jsou v2.0.N (první je v2.0.0 = „Gasbyn Optimizer 2.0.0“). Starší betaverze v2.0.b1.N se nepočítají.
            $max = -1
            foreach ($t in $tags) {
              $m = [regex]::Match([string]$t, '^v2\.0\.(\d+)$')
              if ($m.Success -and [int]$m.Groups[1].Value -gt $max) { $max = [int]$m.Groups[1].Value }
            }
            $n = $max + 1
            $label = "2.0.$n"
            $tag = "v2.0.$n"
            $version = "2.0.$n.0"
            $release = 'true'
          }
          if (-not $version -or $version -notmatch '^\d+(\.\d+){1,3}$') { throw "Verzi se nepodařilo určit: '$version'" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "label=$label" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          Write-Host "Verze: $version, štítek: $label, tag: $tag, release: $release"

      - name: Publikovat aplikaci
        run: >
          dotnet publish GasbynOptimizer.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          --output publish

      - name: Nainstalovat Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Sestavit instalátor
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nenalezen: $iscc" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\GasbynOptimizer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup skončil s kódem $LASTEXITCODE" }

      - name: Nahrát instalátor
        uses: actions/upload-artifact@v4
        with:
          name: GasbynOptimizer-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Vydat release
        if: steps.ver.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Gasbyn Optimizer ${{ steps.ver.outputs.label }}
          generate_release_notes: true
          make_latest: 'true'
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
