name: Build installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Určit verzi
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $version = [regex]::Match((Get-Content GasbynOptimizer.csproj -Raw), '<Version>([^<]+)</Version>').Groups[1].Value
          }
          if (-not $version) { throw 'Verzi se nepodařilo určit.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Verze: $version"

      - name: Publikovat aplikaci
        run: >
          dotnet publish GasbynOptimizer.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          --output publish

      - name: Nainstalovat Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Sestavit instalátor
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nenalezen: $iscc" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\GasbynOptimizer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup skončil s kódem $LASTEXITCODE" }

      - name: Nahrát instalátor
        uses: actions/upload-artifact@v4
        with:
          name: GasbynOptimizer-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Vydat release (jen pro tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Gasbyn Optimizer ${{ steps.ver.outputs.version }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
