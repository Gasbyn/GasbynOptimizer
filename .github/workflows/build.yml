name: Build Windows app

on:
  push:
    branches: [ main, "feature/**", "release/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate embedded updater PowerShell syntax
        shell: pwsh
        run: |
          $source = Get-Content "Services/AppUpdater.cs" -Raw
          $match = [regex]::Match($source, 'private const string UpdateScript = """\r?\n(?<script>[\s\S]*?)\r?\n""";')
          if (-not $match.Success) {
            throw "Could not extract the embedded updater script for syntax checking."
          }
          $scriptText = [regex]::Replace($match.Groups["script"].Value, '(?m)^ {4}', '')
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($scriptText, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host ("Line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            throw "Embedded updater script contains PowerShell syntax errors."
          }

      - name: Publish self-contained Windows app
        run: dotnet publish GasbynOptimizer.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output publish

      - name: Upload ready-to-run app
        uses: actions/upload-artifact@v4
        with:
          name: GasbynOptimizer-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30

      - name: Prepare standalone EXE and updater ZIP
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "publish\GasbynOptimizer.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "PublishSingleFile did not produce publish\GasbynOptimizer.exe."
          }
          Copy-Item -LiteralPath $exe -Destination (Join-Path $env:GITHUB_WORKSPACE "GasbynOptimizer.exe") -Force
          Compress-Archive -LiteralPath $exe -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "GasbynOptimizer-win-x64.zip") -Force
          $otherFiles = @(Get-ChildItem -LiteralPath "publish" -File | Where-Object { $_.Name -ne "GasbynOptimizer.exe" })
          if ($otherFiles.Count -gt 0) {
            Write-Host "The standalone release asset is GasbynOptimizer.exe; other publish files are not included in the user download."
          }

      - name: Derive release tag
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^release/', ''
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Update B5 source tag for updater hotfix
        if: github.ref == 'refs/heads/release/v2.0.B5'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v2.0.B5 $env:GITHUB_SHA
          git push origin +refs/tags/v2.0.B5

      - name: Point release tag at the exact build commit
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$env:RELEASE_TAG" $env:GITHUB_SHA
          git push origin "+refs/tags/$env:RELEASE_TAG"

      - name: Publish release from release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Gasbyn Optimizer ${{ env.RELEASE_TAG }}
          body: |
            ## Gasbyn Optimizer ${{ env.RELEASE_TAG }}

            - Automatic in-app updates from official GitHub Releases.
            - Downloaded packages are verified against GitHub's SHA-256 digest.
            - Updates are applied by a separate process after the app closes, with a backup and rollback attempt if replacing files fails.
            - Download GasbynOptimizer.exe for a one-file app; the ZIP asset is kept for the built-in updater.
          target_commitish: ${{ github.sha }}
          files: |
            GasbynOptimizer.exe
            GasbynOptimizer-win-x64.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

