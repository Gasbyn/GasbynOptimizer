name: Build Windows app

on:
  push:
    branches: [ main, "feature/**", "release/**" ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows app
        run: dotnet publish GasbynOptimizer.csproj --configuration Release --runtime win-x64 --self-contained true --output publish

      - name: Upload ready-to-run app
        uses: actions/upload-artifact@v4
        with:
          name: GasbynOptimizer-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30

      - name: Package release ZIP
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath GasbynOptimizer-win-x64.zip -Force

      - name: Derive release tag
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^release/', ''
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Update B5 source tag for updater hotfix
        if: github.ref == 'refs/heads/release/v2.0.B5'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v2.0.B5 $env:GITHUB_SHA
          git push origin +refs/tags/v2.0.B5

      - name: Publish release from release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Gasbyn Optimizer ${{ env.RELEASE_TAG }}
          body: |
            ## Gasbyn Optimizer ${{ env.RELEASE_TAG }}

            - Automatic in-app updates from official GitHub Releases.
            - Downloaded packages are verified against GitHub's SHA-256 digest.
            - Updates are applied by a separate process after the app closes, with a backup and rollback attempt if replacing files fails.
          target_commitish: ${{ github.sha }}
          files: GasbynOptimizer-win-x64.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach ZIP to published GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.name }}
          files: GasbynOptimizer-win-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
