name: Build Windows app

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows app
        run: dotnet publish GasbynOptimizer.csproj --configuration Release --runtime win-x64 --self-contained true --output publish

      - name: Upload ready-to-run app
        uses: actions/upload-artifact@v4
        with:
          name: GasbynOptimizer-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30

      - name: Package release ZIP
        if: github.event_name == 'release'
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath GasbynOptimizer-win-x64.zip -Force

      - name: Attach ZIP to published GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.name }}
          files: GasbynOptimizer-win-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
