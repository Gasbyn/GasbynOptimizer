name: Build Windows app

on:
  push:
    branches: [ main, "feature/**", "release/**" ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore MainWindow.Workspace.cs if corrupted
        id: restore_ws
        shell: pwsh
        run: |
          $path = "MainWindow.Workspace.cs"
          $text = Get-Content $path -Raw -ErrorAction SilentlyContinue
          $needsRestore = (-not $text) -or ($text.Length -lt 10000) -or ($text -match 'file:///') -or ($text -match 'PLACEHOLDER|TOO_LARGE|Full body is large')
          if ($needsRestore) {
            Write-Host "Workspace.cs is missing or corrupted ($(($text ?? '').Length) chars) — restoring from release/v2.0.B20"
            $url = "https://raw.githubusercontent.com/Gasbyn/GasbynOptimizer/release/v2.0.B20/MainWindow.Workspace.cs"
            Invoke-WebRequest -Uri $url -OutFile $path -UseBasicParsing
            $restored = Get-Content $path -Raw
            if ($restored.Length -lt 10000) { throw "Restore failed — file still too small ($($restored.Length) chars)" }
            Write-Host "Restored Workspace.cs ($($restored.Length) chars)"
            "restored=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "Workspace.cs looks OK ($($text.Length) chars)"
            "restored=false" >> $env:GITHUB_OUTPUT
          }

      - name: Apply B21 Tweaks UI patches
        shell: pwsh
        run: |
          $path = "MainWindow.Workspace.cs"
          $ws = Get-Content $path -Raw

          # 1) Search + filter toolbar host at start of Tweaks
          $oldBuild = @'
    private void BuildTweaksWorkspace(bool gamingOnly = false)
    {
        _workspaceSwitches.Clear();
        _workspaceSwitchStatuses.Clear();

        if (gamingOnly)
        {
'@
          $newBuild = @'
    private void BuildTweaksWorkspace(bool gamingOnly = false)
    {
        _workspaceSwitches.Clear();
        _workspaceSwitchStatuses.Clear();
        EnsureTweakDeckHost(gamingOnly);

        if (gamingOnly)
        {
'@
          if ($ws.Contains('EnsureTweakDeckHost(gamingOnly)')) {
            Write-Host 'EnsureTweakDeckHost already present'
          } elseif ($ws.Contains($oldBuild)) {
            $ws = $ws.Replace($oldBuild, $newBuild)
            Write-Host 'Patched EnsureTweakDeckHost call'
          } else {
            Write-Host 'WARN: BuildTweaksWorkspace pattern not found'
          }

          # 2) Route cards into deck host (search/filter grid)
          $oldAdd = @'
        card.Child = root;
        SecondaryContent.Children.Add(card);
    }

    private Border CreateTweakBadge
'@
          $newAdd = @'
        card.Child = root;
        if (_tweakDeckHost is not null)
        {
            _tweakDeckHost.Children.Add(card);
            _tweakDeckIndex.Add((id, card, title, description, badges, incompatible));
        }
        else
            SecondaryContent.Children.Add(card);
    }

    private Border CreateTweakBadge
'@
          if ($ws.Contains('_tweakDeckHost is not null')) {
            Write-Host 'Deck host routing already present'
          } elseif ($ws.Contains($oldAdd)) {
            $ws = $ws.Replace($oldAdd, $newAdd)
            Write-Host 'Patched deck host card routing'
          } else {
            Write-Host 'WARN: card Add pattern not found'
          }

          # 3) Remove High Performance power plan card from Tweaks list
          $hp = @'
        AddWorkspaceTweakCard(
            "High Performance power plan",
            "Aktivuje vestavěný plán Vysoký výkon. Může zvýšit spotřebu energie a teploty.",
            "power-plan",
            "ON: aktivuje plán napájení Vysoký výkon. OFF: aktivuje původní ID plánu uložené před změnou. Vyšší spotřeba a teploty jsou možné.", "POKROČILÉ", "VÝKON", "SPOTŘEBA");

'@
          if ($ws.Contains($hp)) {
            $ws = $ws.Replace($hp, '')
            Write-Host 'Removed HP power plan card'
          } else {
            Write-Host 'HP power plan card not found (ok if already removed)'
          }

          # 4) Confirm when enabling incompatible tweak
          $oldChecked = @'
        toggle.Checked += async (_, _) =>
        {
            if (!_loadingWorkspaceSwitches)
                await ChangeWorkspaceTweakAsync(id, true, toggle, status);
        };
'@
          $newChecked = @'
        toggle.Checked += async (_, _) =>
        {
            if (_loadingWorkspaceSwitches) return;
            if (incompatible)
            {
                var ok = MessageBox.Show(
                    "Tato optimalizace není podporována na tvé sestavě." +
                    Environment.NewLine + Environment.NewLine +
                    "Opravdu ji chceš zapnout?",
                    "Nepodporovaná optimalizace",
                    MessageBoxButton.YesNo,
                    MessageBoxImage.Warning);
                if (ok != MessageBoxResult.Yes)
                {
                    _loadingWorkspaceSwitches = true;
                    toggle.IsChecked = false;
                    _loadingWorkspaceSwitches = false;
                    return;
                }
            }
            await ChangeWorkspaceTweakAsync(id, true, toggle, status);
        };
'@
          if ($ws.Contains('Nepodporovaná optimalizace')) {
            Write-Host 'Incompat confirm already present'
          } elseif ($ws.Contains($oldChecked)) {
            $ws = $ws.Replace($oldChecked, $newChecked)
            Write-Host 'Patched incompat confirmation'
          } else {
            Write-Host 'WARN: toggle.Checked pattern not found'
          }

          # 5) AMD toggle unlock with advanced mode + confirm
          $oldAmd = @'
            Style = (Style)FindResource("SwitchToggleButton"),
            IsChecked = false,
            IsEnabled = false,
            ToolTip = warning,
            VerticalAlignment = VerticalAlignment.Center
        };
        System.Windows.Automation.AutomationProperties.SetName(unavailable, "AMD Radeon-only GPU tuning — unavailable");
        Grid.SetColumn(unavailable, 1);
'@
          $newAmd = @'
            Style = (Style)FindResource("SwitchToggleButton"),
            IsChecked = false,
            IsEnabled = advanced,
            ToolTip = advanced
                ? "Pokročilý režim: při zapnutí potvrď omezení."
                : "🔒 Zapni Pokročilý režim v Settings.",
            VerticalAlignment = VerticalAlignment.Center
        };
        System.Windows.Automation.AutomationProperties.SetName(unavailable, "AMD Radeon-only GPU tuning");
        unavailable.Checked += (_, _) =>
        {
            if (!advanced) { unavailable.IsChecked = false; return; }
            var ok = MessageBox.Show(
                "AMD Radeon-only tuning je jen indikátor — agresivní ovladačové změny se neprovádějí." +
                Environment.NewLine + Environment.NewLine +
                "Opravdu pokračovat?",
                "Nepodporovaná / omezená optimalizace",
                MessageBoxButton.YesNo,
                MessageBoxImage.Warning);
            if (ok != MessageBoxResult.Yes)
                unavailable.IsChecked = false;
        };
        Grid.SetColumn(unavailable, 1);
'@
          if ($ws.Contains('IsEnabled = advanced') -and $ws.Contains('AMD Radeon-only GPU tuning')) {
            Write-Host 'AMD unlock already present'
          } elseif ($ws.Contains($oldAmd)) {
            $ws = $ws.Replace($oldAmd, $newAmd)
            Write-Host 'Patched AMD unlock'
          } else {
            Write-Host 'WARN: AMD toggle pattern not found'
          }

          Set-Content -Path $path -Value $ws -NoNewline -Encoding utf8
          Write-Host "Workspace.cs after patches: $((Get-Item $path).Length) bytes"

      - name: Commit restored Workspace.cs back to branch
        if: steps.restore_ws.outputs.restored == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MainWindow.Workspace.cs
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: restore MainWindow.Workspace.cs from B20 baseline"
            git push origin HEAD:${{ github.ref_name }}
          } else {
            Write-Host "No Workspace changes to commit"
          }

      - name: Validate embedded updater PowerShell syntax
        shell: pwsh
        run: |
          $source = Get-Content "Services/AppUpdater.cs" -Raw
          $match = [regex]::Match($source, 'private const string UpdateScript = """\r?\n(?<script>[\s\S]*?)\r?\n""";')
          if (-not $match.Success) {
            throw "Could not extract the embedded updater script for syntax checking."
          }
          $scriptText = [regex]::Replace($match.Groups["script"].Value, '(?m)^ {4}', '')
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($scriptText, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host ("Line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message) }
            throw "Embedded updater script contains PowerShell syntax errors."
          }

      - name: Publish self-contained Windows app
        run: dotnet publish GasbynOptimizer.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output publish

      - name: Upload ready-to-run app
        uses: actions/upload-artifact@v4
        with:
          name: GasbynOptimizer-win-x64
          path: publish/
          if-no-files-found: error
          retention-days: 30

      - name: Package release ZIP
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath GasbynOptimizer-win-x64.zip -Force

      - name: Derive release tag
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^release/', ''
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Publish release from release branch
        if: startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Gasbyn Optimizer ${{ env.RELEASE_TAG }}
          body: |
            ## Gasbyn Optimizer ${{ env.RELEASE_TAG }}

            - Tweaks: search + filters toolbar, deck card host
            - One Advanced mode in Settings (with confirm)
            - Unsupported tweaks ask for confirmation; AMD unlock in Advanced mode
            - High Performance power plan card removed from Tweaks
            - In-app updates from GitHub Releases (SHA-256 verified)
          target_commitish: ${{ github.sha }}
          files: GasbynOptimizer-win-x64.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach ZIP to published GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.name }}
          files: GasbynOptimizer-win-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
